[package]
name = "polyfish"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
rand = { version = "0.9", default-features = false, features = ["alloc"] }
strum = "0.27"
strum_macros = "0.27"
indexmap = { version = "2.0", features = ["serde"] }
dyn-clone = "1.0"
thiserror = "2.0"

